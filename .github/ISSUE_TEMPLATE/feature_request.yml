name: Feature request
description: Propose an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: "What are you trying to do, and what gets in the way?" }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposal }
  - type: textarea
    id: evidence
    attributes: { label: Evidence, description: "For retrieval/evaluation changes: how would we measure the improvement?" }
