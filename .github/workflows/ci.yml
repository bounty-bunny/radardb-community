# CI for the community edition. Actions are pinned to commit SHAs (tag in the comment); Dependabot keeps them current.
name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
        include:
          - { os: ubuntu-latest, node: 20 } # declared minimum (engines: >= 20.9)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      - name: Cache local models (downloaded once from the Hugging Face Hub)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: hf-models-v1-${{ runner.os }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: CLI smoke test
        run: npm run radar -- doctor

  kit:
    name: schemas, benchmark kit, quick start
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Cache local models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: hf-models-v1-${{ runner.os }}
      - name: JSON Schemas are up to date
        run: npm run schemas && git diff --exit-code -- schemas/
      - name: Benchmark kit typechecks (harness and research evaluators)
        run: |
          (cd validation && npm ci)
          npx tsc --noEmit -p validation/tsconfig.json
          npx tsc --noEmit -p research/v1.1/tsconfig.json
      - name: Quick start (synthetic example) runs and passes integrity checks
        env: { RADAR_DATA_DIR: .radar/quickstart, RADAR_SOURCES_ROOT: examples/quickstart }
        run: |
          npm run benchmark -- docs examples/quickstart/questions.json "Quillstack quick start"
          report=$(ls -t .radar/quickstart/benchmarks/*/report.md | head -1)
          grep -A2 "^## Evaluation integrity" "$report" | grep -q "^Passed"
          grep -E "^\| (Typical retrieval|RadarDB plans) \|" "$report"

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - name: Every commit is signed off by its author (DCO 1.1, see CONTRIBUTING.md)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git log -1 --format='%an <%ae>' "$c")
            case "$author" in *"[bot]"*) echo "skip bot commit $c ($author)"; continue ;; esac
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$c" | grep -qxF "$author"; then
              echo "::error::commit $c is not signed off by its author ($author). Fix: git rebase --signoff $BASE"
              fail=1
            fi
          done
          exit $fail
